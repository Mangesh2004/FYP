[pytest]
testpaths = tests
addopts = -p no:cacheprovider --basetemp=runs/pytest_tmp
markers =
    webots: launches headless Webots episodes (slow, several minutes)
    single_robot: launches one-robot Webots physics regression tests
    pair_robot: launches two-robot physical coordination tests
    hazard_webots: full multi-layout camera and specialty sensor verification missions
    fire_demo: one-robot native detector, sensor and stopped fire demonstration
